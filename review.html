<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmed</title>
    <link rel="stylesheet" href="styles/form.css">
    <style>
        .confirmation-box {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: auto;
        }
        .counter-badge {
            display: inline-block;
            background: var(--accent-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <main style="align-items: center;">
        <div class="confirmation-box">
            <h2>Thank You for Your Feedback!</h2>
            <p>Your product review has been successfully recorded.</p>
            <div class="counter-badge">Total Reviews Submitted: <span id="review-count">0</span></div>
            <p style="margin-top: 20px;"><a href="form.html" style="color: var(--primary-color);">Submit another review</a></p>
        </div>
    </main>

    <script>
        
        let reviewCount = localStorage.getItem('reviewCountTotal');
        
        if (!reviewCount) {
            reviewCount = 0;
        }
        
        reviewCount = parseInt(reviewCount) + 1;
        localStorage.setItem('reviewCountTotal', reviewCount);
        
        // Show output value
        document.getElementById('review-count').textContent = reviewCount;
    </script>
</body>
</html>
